name: Deploy Tech4Future-Global Portal to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI / Test Quality Gate (PostgreSQL 17)
  # ============================================================================
  test:
    name: Run Unit & Integration Tests (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Django System Check (PostgreSQL)
        env:
          DB_ENGINE: postgresql
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          python backend/manage.py check

      - name: Execute Pytest Suite (PostgreSQL)
        env:
          DB_ENGINE: postgresql
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          pytest backend/tests

  # ============================================================================
  # 2. CD / Automated VPS Deployment, Nginx Setup & SSL Certificate
  # ============================================================================
  deploy:
    name: Deploy to Production VPS (portal.t4f-global.org)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate Deployment Credentials
        run: |
          HAS_ERRORS=0
          if [ -z "${{ secrets.VPS_HOST || vars.VPS_HOST }}" ]; then
            echo "::error::Missing VPS_HOST! Please add VPS_HOST in GitHub: Settings > Secrets and variables > Actions > Secrets (or Variables)."
            HAS_ERRORS=1
          fi
          if [ -z "${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}" ]; then
            echo "::error::Missing VPS_USERNAME! Please add VPS_USERNAME in GitHub: Settings > Secrets and variables > Actions > Secrets (or Variables)."
            HAS_ERRORS=1
          fi
          if [ -z "${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}" ] && [ -z "${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing VPS_PASSWORD or VPS_SSH_KEY! Please add VPS_PASSWORD in GitHub: Settings > Secrets and variables > Actions > Secrets."
            HAS_ERRORS=1
          fi
          if [ "$HAS_ERRORS" -eq 1 ]; then
            echo ""
            echo "=================================================================================="
            echo "❌ Setup Guide: How to configure your VPS credentials in GitHub:"
            echo "1. Go to your repository on GitHub."
            echo "2. Click 'Settings' (gear icon) at the top."
            echo "3. In the left sidebar, click 'Secrets and variables' -> 'Actions'."
            echo "4. Under the 'Secrets' tab, click the green 'New repository secret' button."
            echo "5. Add each secret:"
            echo "     Name: VPS_HOST       Value: <your VPS IP address, e.g. 187.7.19.226>"
            echo "     Name: VPS_USERNAME   Value: <your SSH username, e.g. root or erasmus>"
            echo "     Name: VPS_PASSWORD   Value: <your SSH login password>"
            echo "=================================================================================="
            exit 1
          fi
          echo "✅ All required deployment credentials found."

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          request_pty: true
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            # Sudo helper that works with root, passwordless sudo, or password prompt
            run_sudo() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              elif sudo -n true 2>/dev/null; then
                sudo "$@"
              else
                echo "${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}" | sudo -S -p '' "$@"
              fi
            }

            # Determine Target Directory
            if [ -n "${{ vars.DEPLOY_PATH }}" ]; then
              TARGET_DIR="${{ vars.DEPLOY_PATH }}"
            elif [ "$(id -u)" -eq 0 ]; then
              TARGET_DIR="/var/www/portal.t4f-global.org"
            else
              TARGET_DIR="$HOME/portal.t4f-global.org"
            fi

            echo "==> Deploying to target directory: $TARGET_DIR..."

            # Ensure git is installed
            if ! command -v git >/dev/null 2>&1; then
              echo "==> Installing git on VPS..."
              run_sudo apt-get update -q && run_sudo apt-get install -y -q git
            fi

            # Check if directory exists and has git repo initialized
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "==> Repository not initialized in $TARGET_DIR. Cloning via HTTPS..."
              mkdir -p "$TARGET_DIR" 2>/dev/null || run_sudo mkdir -p "$TARGET_DIR"
              run_sudo chown -R "$(whoami)":"$(whoami)" "$TARGET_DIR" 2>/dev/null || true
              git clone https://github.com/ErasmusBill/aigc_tech_portal.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # Ensure remote is clean HTTPS
            git remote set-url origin https://github.com/ErasmusBill/aigc_tech_portal.git

            # Pull latest changes
            echo "==> Pulling latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Determine docker command
            if docker info >/dev/null 2>&1; then
              DOCKER_COMPOSE="docker compose"
            elif sudo -n docker info >/dev/null 2>&1; then
              DOCKER_COMPOSE="sudo docker compose"
            else
              DOCKER_COMPOSE="echo ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }} | sudo -S docker compose"
            fi

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "==> Notice: .env not found on server. Creating from .env.production.example..."
              cp .env.production.example .env
              echo "IMPORTANT: Verify production database and secret settings in $TARGET_DIR/.env"
            fi

            # Build and launch production Docker stack (Web port 8080)
            echo "==> Building and starting Docker Compose containers (Web port 8080)..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml build
            $DOCKER_COMPOSE -f docker-compose.prod.yml up -d

            # Run database migrations
            echo "==> Executing PostgreSQL migrations..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput

            # Collect static files for WhiteNoise
            echo "==> Collecting static assets..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput || true

            # Seed / sync platform users
            echo "==> Verifying platform users..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml exec -T web python manage.py seed_all_users || true

            # ================================================================
            # 3. Automatically Configure Host Nginx & SSL Certificate
            # ================================================================
            echo "==> Checking Host Nginx configuration..."
            if ! command -v nginx >/dev/null 2>&1; then
              echo "==> Installing Nginx on host..."
              run_sudo apt-get update -q && run_sudo apt-get install -y -q nginx
            fi

            echo "==> Deploying Nginx site config for portal.t4f-global.org..."
            run_sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            run_sudo cp docker/nginx/host-nginx-portal.t4f-global.org.conf /etc/nginx/sites-available/portal.t4f-global.org
            run_sudo ln -sf /etc/nginx/sites-available/portal.t4f-global.org /etc/nginx/sites-enabled/
            run_sudo nginx -t && run_sudo systemctl reload nginx
            echo "==> Host Nginx successfully configured and reloaded."

            # Automatically install Certbot and provision SSL
            echo "==> Checking SSL certificate for portal.t4f-global.org..."
            if ! command -v certbot >/dev/null 2>&1; then
              echo "==> Installing Certbot and python3-certbot-nginx..."
              run_sudo apt-get update -q && run_sudo apt-get install -y -q certbot python3-certbot-nginx
            fi

            # Provision SSL certificate if not already created
            if [ ! -d "/etc/letsencrypt/live/portal.t4f-global.org" ]; then
              echo "==> Requesting new Let's Encrypt SSL certificate for portal.t4f-global.org..."
              run_sudo certbot --nginx -d portal.t4f-global.org --non-interactive --agree-tos --email "${SSL_EMAIL:-admin@t4f-global.org}" --redirect || echo "Notice: Certbot DNS challenge will complete once DNS points to this server IP."
            else
              echo "==> [OK] SSL Certificate for portal.t4f-global.org is already active."
            fi

            # ================================================================
            # 4. Final Health Check
            # ================================================================
            echo "==> Running system health probe..."
            sleep 4
            HEALTH_URL="http://127.0.0.1:8080/api/v1/system/health"
            if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "==> [OK] System is healthy and responding at $HEALTH_URL"
            else
              echo "==> [NOTICE] Container is starting up. Check logs if needed."
            fi

            echo "================================================================"
            echo "==> DEPLOYMENT COMPLETE: https://portal.t4f-global.org"
            echo "================================================================"
