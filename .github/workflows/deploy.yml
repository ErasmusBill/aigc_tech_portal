name: Deploy Tech4Future-Global Portal to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI / Test Quality Gate
  # ============================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Django System Check
        env:
          DB_ENGINE: sqlite
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          python backend/manage.py check

      - name: Execute Pytest Suite
        env:
          DB_ENGINE: sqlite
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          pytest backend/tests

  # ============================================================================
  # 2. CD / Automated VPS Deployment (Supports Password & SSH Key Authentication)
  # ============================================================================
  deploy:
    name: Deploy to Production VPS (portal.t4f-global.org)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_DIR="${{ vars.DEPLOY_PATH || '/var/www/portal.t4f-global.org' }}"
            echo "==> Deploying to target directory: $TARGET_DIR..."

            # Ensure git is installed
            if ! command -v git >/dev/null 2>&1; then
              echo "Error: git is not installed on the VPS."
              exit 1
            fi

            # Check if directory exists and has git repo initialized
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Repository not initialized in $TARGET_DIR. Cloning via HTTPS..."
              mkdir -p "$TARGET_DIR"
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # Set authenticated HTTPS remote URL using ephemeral GitHub token
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

            # Pull latest changes
            echo "==> Pulling latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Determine docker command (handles both non-root docker and sudo docker)
            if docker info >/dev/null 2>&1; then
              DOCKER_COMPOSE="docker compose"
            elif sudo -n docker info >/dev/null 2>&1; then
              DOCKER_COMPOSE="sudo docker compose"
            else
              DOCKER_COMPOSE="docker compose"
            fi

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "Notice: .env not found on server. Creating from .env.production.example..."
              cp .env.production.example .env
              echo "IMPORTANT: Verify production database and secret settings in $TARGET_DIR/.env"
            fi

            # Build and launch production Docker stack
            echo "==> Building and starting Docker Compose containers (Web port 8080)..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml build
            $DOCKER_COMPOSE -f docker-compose.prod.yml up -d

            # Run database migrations
            echo "==> Executing database migrations..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput

            # Collect static files for WhiteNoise
            echo "==> Collecting static assets..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput || true

            # Seed / sync platform users
            echo "==> Verifying platform users..."
            $DOCKER_COMPOSE -f docker-compose.prod.yml exec -T web python manage.py seed_all_users || true

            # Verify health status on port 8080
            echo "==> Running system health probe..."
            sleep 5
            HEALTH_URL="http://127.0.0.1:8080/api/v1/system/health"
            if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "==> [OK] System is healthy and responding at $HEALTH_URL"
            else
              echo "==> [NOTICE] Container started. If health probe failed, verify docker logs with: $DOCKER_COMPOSE -f docker-compose.prod.yml logs"
            fi

            echo "==> Deployment of portal.t4f-global.org completed successfully!"
