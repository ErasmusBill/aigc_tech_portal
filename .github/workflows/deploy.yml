name: Deploy Tech4Future-Global Portal to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI / Test Quality Gate (PostgreSQL 17)
  # ============================================================================
  test:
    name: Run Unit & Integration Tests (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Django System Check (PostgreSQL)
        env:
          DB_ENGINE: postgresql
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          python backend/manage.py check

      - name: Execute Pytest Suite (PostgreSQL)
        env:
          DB_ENGINE: postgresql
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          pytest backend/tests

  # ============================================================================
  # 2. CD / Automated VPS Deployment, Nginx Setup & SSL Certificate
  # ============================================================================
  deploy:
    name: Deploy to Production VPS (portal.t4f-global.org)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate Deployment Credentials
        run: |
          HAS_ERRORS=0
          if [ -z "${{ secrets.VPS_HOST || vars.VPS_HOST }}" ]; then
            echo "::error::Missing VPS_HOST! Please add VPS_HOST in GitHub: Settings > Secrets and variables > Actions > Secrets (or Variables)."
            HAS_ERRORS=1
          fi
          if [ -z "${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}" ]; then
            echo "::error::Missing VPS_USERNAME! Please add VPS_USERNAME in GitHub: Settings > Secrets and variables > Actions > Secrets (or Variables)."
            HAS_ERRORS=1
          fi
          if [ -z "${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}" ] && [ -z "${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing VPS_PASSWORD or VPS_SSH_KEY! Please add VPS_PASSWORD in GitHub: Settings > Secrets and variables > Actions > Secrets."
            HAS_ERRORS=1
          fi
          if [ "$HAS_ERRORS" -eq 1 ]; then
            echo ""
            echo "=================================================================================="
            echo "❌ Setup Guide: How to configure your VPS credentials in GitHub:"
            echo "1. Go to your repository on GitHub."
            echo "2. Click 'Settings' (gear icon) at the top."
            echo "3. In the left sidebar, click 'Secrets and variables' -> 'Actions'."
            echo "4. Under the 'Secrets' tab, click the green 'New repository secret' button."
            echo "5. Add each secret:"
            echo "     Name: VPS_HOST       Value: <your VPS IP address, e.g. 187.7.19.226>"
            echo "     Name: VPS_USERNAME   Value: <your SSH username, e.g. root or erasmus>"
            echo "     Name: VPS_PASSWORD   Value: <your SSH login password>"
            echo "=================================================================================="
            exit 1
          fi
          echo "✅ All required deployment credentials found."

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          USER_PASS: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
          DEPLOY_OVERRIDE: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          script_stop: false
          command_timeout: 30m
          envs: USER_PASS,DEPLOY_OVERRIDE
          script: |
            echo "================================================================"
            echo "==> SSH connection successfully established!"
            echo "==> Connected as user: $(whoami)"
            echo "==> Working directory: $(pwd)"
            echo "================================================================"

            # Target directory in user's home (safe from root/sudo permission blocks)
            if [ -n "$DEPLOY_OVERRIDE" ]; then
              TARGET_DIR="$DEPLOY_OVERRIDE"
            else
              TARGET_DIR="$HOME/aigc_tech_portal"
            fi
            echo "==> Target project directory: $TARGET_DIR"

            # Ensure git is available
            if ! command -v git >/dev/null 2>&1; then
              echo "Error: git is not installed on this VPS."
              exit 1
            fi

            # Clone repository if not present
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "==> Initializing and cloning repository into $TARGET_DIR..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/ErasmusBill/aigc_tech_portal.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "==> Current repo path: $(pwd)"

            # Ensure remote URL is clean HTTPS
            git remote set-url origin https://github.com/ErasmusBill/aigc_tech_portal.git
            echo "==> Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main
            echo "==> Deployed Commit: $(git rev-parse --short HEAD)"

            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            USER_PASS="${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}"

            # Define robust sudo and docker runners
            run_sudo() {
              if [ "$(id -u)" -eq 0 ]; then
                env PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH" "$@"
              elif sudo -n true 2>/dev/null; then
                sudo env PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH" "$@"
              elif [ -n "$USER_PASS" ]; then
                echo "$USER_PASS" | sudo -S -p '' env PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH" "$@"
              else
                env PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH" "$@"
              fi
            }

            run_docker() {
              if docker compose version >/dev/null 2>&1 && docker ps >/dev/null 2>&1; then
                docker compose "$@"
              elif docker-compose version >/dev/null 2>&1 && docker-compose ps >/dev/null 2>&1; then
                docker-compose "$@"
              elif command -v docker >/dev/null 2>&1 && run_sudo docker compose version >/dev/null 2>&1; then
                run_sudo docker compose "$@"
              else
                run_sudo docker-compose "$@"
              fi
            }

            # Ensure .env exists with production secrets
            if [ ! -f .env ]; then
              echo "==> Generating .env from .env.production.example..."
              cp .env.production.example .env
              RANDOM_SECRET=$(openssl rand -hex 32 2>/dev/null || date +%s%N)
              RANDOM_DB_PASS=$(openssl rand -hex 16 2>/dev/null || echo "t4f_secure_db_pass_2027")
              sed -i "s|generate-and-set-a-strong-random-secret-key-here|$RANDOM_SECRET|g" .env
              sed -i "s|generate-a-strong-database-password-here|$RANDOM_DB_PASS|g" .env
            fi

            # Build and start Docker stack (PostgreSQL 17, Redis, Web on port 8080)
            echo "==> Starting production containers..."
            run_docker -f docker-compose.prod.yml build
            run_docker -f docker-compose.prod.yml up -d

            # Run database migrations with fake-initial support for pre-existing tables
            echo "==> Running database migrations..."
            run_docker -f docker-compose.prod.yml exec -T web python manage.py migrate --fake-initial --noinput

            # Collect static files
            echo "==> Collecting static assets..."
            run_docker -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput || true

            # Seed platform users
            echo "==> Seeding platform users..."
            run_docker -f docker-compose.prod.yml exec -T web python manage.py seed_all_users || true

            # Configure Host Nginx & SSL
            echo "==> Setting up Host Nginx configuration..."
            NGINX_CONF="$TARGET_DIR/docker/nginx/host-nginx-portal.t4f-global.org.conf"

            # Locate Nginx binary across system paths
            NGINX_BIN=""
            for p in $(which nginx 2>/dev/null) /usr/sbin/nginx /usr/local/sbin/nginx /usr/bin/nginx; do
              if [ -x "$p" ]; then
                NGINX_BIN="$p"
                break
              fi
            done

            if [ -z "$NGINX_BIN" ]; then
              echo "==> Nginx binary not found. Checking active listeners on port 80/443..."
              run_sudo ss -tlpn | grep -E ':80|:443' || true
              if command -v apt-get >/dev/null 2>&1; then
                echo "==> Installing nginx, certbot, and python3-certbot-nginx..."
                run_sudo apt-get update -y
                run_sudo apt-get install -y nginx certbot python3-certbot-nginx
                NGINX_BIN=$(which nginx 2>/dev/null || echo "/usr/sbin/nginx")
              fi
            fi

            if [ -n "$NGINX_BIN" ] && [ -f "$NGINX_CONF" ]; then
              echo "==> Using Nginx at: $NGINX_BIN"
              
              # Ensure webroot and configuration directories exist
              run_sudo mkdir -p /var/www/html /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/conf.d

              # Deploy site config with .conf extension
              if grep -q "sites-enabled" /etc/nginx/nginx.conf 2>/dev/null || [ -d "/etc/nginx/sites-available" ]; then
                echo "==> Deploying Nginx site to /etc/nginx/sites-available/portal.t4f-global.org.conf..."
                run_sudo cp "$NGINX_CONF" /etc/nginx/sites-available/portal.t4f-global.org.conf
                run_sudo ln -sf /etc/nginx/sites-available/portal.t4f-global.org.conf /etc/nginx/sites-enabled/portal.t4f-global.org.conf
                # Clean up legacy unextended links if present
                run_sudo rm -f /etc/nginx/sites-available/portal.t4f-global.org /etc/nginx/sites-enabled/portal.t4f-global.org 2>/dev/null || true
              fi

              if [ -d "/etc/nginx/conf.d" ] && ! grep -q "sites-enabled" /etc/nginx/nginx.conf 2>/dev/null; then
                echo "==> Deploying Nginx site to /etc/nginx/conf.d/portal.t4f-global.org.conf..."
                run_sudo cp "$NGINX_CONF" /etc/nginx/conf.d/portal.t4f-global.org.conf
              fi

              # Validate and reload Nginx
              if run_sudo "$NGINX_BIN" -t; then
                echo "==> Nginx test passed. Reloading Nginx service..."
                run_sudo systemctl reload nginx 2>/dev/null || run_sudo service nginx reload 2>/dev/null || run_sudo "$NGINX_BIN" -s reload || true

                # Automatic Let's Encrypt SSL via Certbot
                CERTBOT_BIN=""
                for cb in $(which certbot 2>/dev/null) /usr/bin/certbot /usr/local/bin/certbot /snap/bin/certbot; do
                  if [ -x "$cb" ]; then
                    CERTBOT_BIN="$cb"
                    break
                  fi
                done

                if [ -n "$CERTBOT_BIN" ]; then
                  echo "==> Provisioning / verifying Let's Encrypt SSL certificate for portal.t4f-global.org..."
                  run_sudo "$CERTBOT_BIN" --nginx -d portal.t4f-global.org --non-interactive --agree-tos --email admin@t4f-global.org --redirect --keep-until-expiring || echo "::warning::Certbot encountered an error during certificate issuance"
                else
                  echo "==> [Notice] Certbot binary not found in standard paths."
                fi
              else
                echo "::warning::Nginx configuration test failed, skipping reload to prevent downtime."
              fi
            fi

            # Health Check (Retry loop)
            echo "==> Checking application health on port 8080..."
            HEALTH_OK=0
            for i in $(seq 1 15); do
              sleep 3
              if curl -sf http://127.0.0.1:8080/api/v1/system/health > /dev/null; then
                echo "==> [SUCCESS] App is healthy and responding at http://127.0.0.1:8080 (attempt $i)"
                HEALTH_OK=1
                break
              fi
              echo "==> Waiting for container to become healthy... (attempt $i/15)"
            done
            if [ "$HEALTH_OK" -eq 0 ]; then
              echo "==> [WARNING] Health check failed after 45s. Showing container logs:"
              run_docker -f docker-compose.prod.yml logs --tail=40 web
            fi

            echo "================================================================"
            echo "==> DEPLOYMENT COMPLETE: https://portal.t4f-global.org"
            echo "================================================================"
