name: Deploy Tech4Future-Global Portal to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI / Test Quality Gate (PostgreSQL 17)
  # ============================================================================
  test:
    name: Run Unit & Integration Tests (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Django System Check (PostgreSQL)
        env:
          DB_ENGINE: postgresql
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          python backend/manage.py check

      - name: Execute Pytest Suite (PostgreSQL)
        env:
          DB_ENGINE: postgresql
          POSTGRES_DB: t4f_global
          POSTGRES_USER: t4f_app
          POSTGRES_PASSWORD: ci_postgres_password_2027
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-fifty-characters-long-2027
          DJANGO_DEBUG: "false"
        run: |
          pytest backend/tests

  # ============================================================================
  # 2. CD / Automated VPS Deployment, Nginx Setup & SSL Certificate
  # ============================================================================
  deploy:
    name: Deploy to Production VPS (portal.t4f-global.org)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate Deployment Credentials
        run: |
          HAS_ERRORS=0
          if [ -z "${{ secrets.VPS_HOST || vars.VPS_HOST }}" ]; then
            echo "::error::Missing VPS_HOST! Please add VPS_HOST in GitHub: Settings > Secrets and variables > Actions > Secrets (or Variables)."
            HAS_ERRORS=1
          fi
          if [ -z "${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}" ]; then
            echo "::error::Missing VPS_USERNAME! Please add VPS_USERNAME in GitHub: Settings > Secrets and variables > Actions > Secrets (or Variables)."
            HAS_ERRORS=1
          fi
          if [ -z "${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}" ] && [ -z "${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing VPS_PASSWORD or VPS_SSH_KEY! Please add VPS_PASSWORD in GitHub: Settings > Secrets and variables > Actions > Secrets."
            HAS_ERRORS=1
          fi
          if [ "$HAS_ERRORS" -eq 1 ]; then
            echo ""
            echo "=================================================================================="
            echo "❌ Setup Guide: How to configure your VPS credentials in GitHub:"
            echo "1. Go to your repository on GitHub."
            echo "2. Click 'Settings' (gear icon) at the top."
            echo "3. In the left sidebar, click 'Secrets and variables' -> 'Actions'."
            echo "4. Under the 'Secrets' tab, click the green 'New repository secret' button."
            echo "5. Add each secret:"
            echo "     Name: VPS_HOST       Value: <your VPS IP address, e.g. 187.7.19.226>"
            echo "     Name: VPS_USERNAME   Value: <your SSH username, e.g. root or erasmus>"
            echo "     Name: VPS_PASSWORD   Value: <your SSH login password>"
            echo "=================================================================================="
            exit 1
          fi
          echo "✅ All required deployment credentials found."

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          USER_PASS: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
          DEPLOY_OVERRIDE: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          script_stop: false
          command_timeout: 30m
          envs: USER_PASS,DEPLOY_OVERRIDE
          script: |
            echo "================================================================"
            echo "==> SSH connection successfully established!"
            echo "==> Connected as user: $(whoami)"
            echo "==> Working directory: $(pwd)"
            echo "================================================================"

            # Target directory in user's home (safe from root/sudo permission blocks)
            if [ -n "$DEPLOY_OVERRIDE" ]; then
              TARGET_DIR="$DEPLOY_OVERRIDE"
            else
              TARGET_DIR="$HOME/aigc_tech_portal"
            fi
            echo "==> Target project directory: $TARGET_DIR"

            # Ensure git is available
            if ! command -v git >/dev/null 2>&1; then
              echo "Error: git is not installed on this VPS."
              exit 1
            fi

            # Clone repository if not present
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "==> Initializing and cloning repository into $TARGET_DIR..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/ErasmusBill/aigc_tech_portal.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "==> Current repo path: $(pwd)"

            # Ensure remote URL is clean HTTPS
            git remote set-url origin https://github.com/ErasmusBill/aigc_tech_portal.git
            echo "==> Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main
            echo "==> Deployed Commit: $(git rev-parse --short HEAD)"

            # Determine Docker command
            if docker compose version >/dev/null 2>&1; then
              DOCKER="docker compose"
            elif sudo -n docker compose version >/dev/null 2>&1; then
              DOCKER="sudo docker compose"
            elif [ -n "$USER_PASS" ]; then
              DOCKER="echo '$USER_PASS' | sudo -S docker compose"
            else
              DOCKER="docker compose"
            fi
            echo "==> Using Docker runner: $DOCKER"

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "==> Generating .env from .env.production.example..."
              cp .env.production.example .env
            fi

            # Build and start Docker stack (PostgreSQL 17, Redis, Web on port 8080)
            echo "==> Starting production containers..."
            $DOCKER -f docker-compose.prod.yml build
            $DOCKER -f docker-compose.prod.yml up -d

            # Run database migrations
            echo "==> Running database migrations..."
            $DOCKER -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput

            # Collect static files
            echo "==> Collecting static assets..."
            $DOCKER -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput || true

            # Seed platform users
            echo "==> Seeding platform users..."
            $DOCKER -f docker-compose.prod.yml exec -T web python manage.py seed_all_users || true

            # Configure Host Nginx & SSL
            echo "==> Setting up Host Nginx configuration..."
            NGINX_CONF="$TARGET_DIR/docker/nginx/host-nginx-portal.t4f-global.org.conf"
            if [ -f "$NGINX_CONF" ] && [ -d "/etc/nginx/sites-available" ]; then
              echo "==> Deploying Nginx site config for portal.t4f-global.org..."
              if sudo -n true 2>/dev/null; then
                sudo cp "$NGINX_CONF" /etc/nginx/sites-available/portal.t4f-global.org
                sudo ln -sf /etc/nginx/sites-available/portal.t4f-global.org /etc/nginx/sites-enabled/
                sudo nginx -t && sudo systemctl reload nginx || true
                if command -v certbot >/dev/null 2>&1 && [ ! -d "/etc/letsencrypt/live/portal.t4f-global.org" ]; then
                  sudo certbot --nginx -d portal.t4f-global.org --non-interactive --agree-tos --email admin@t4f-global.org --redirect || true
                fi
              elif [ -n "$USER_PASS" ]; then
                echo "$USER_PASS" | sudo -S cp "$NGINX_CONF" /etc/nginx/sites-available/portal.t4f-global.org || true
                echo "$USER_PASS" | sudo -S ln -sf /etc/nginx/sites-available/portal.t4f-global.org /etc/nginx/sites-enabled/ || true
                echo "$USER_PASS" | sudo -S nginx -t && echo "$USER_PASS" | sudo -S systemctl reload nginx || true
                if [ ! -d "/etc/letsencrypt/live/portal.t4f-global.org" ]; then
                  echo "$USER_PASS" | sudo -S certbot --nginx -d portal.t4f-global.org --non-interactive --agree-tos --email admin@t4f-global.org --redirect || true
                fi
              fi
            fi

            # Health Check
            echo "==> Checking application health on port 8080..."
            sleep 4
            if curl -sf http://127.0.0.1:8080/api/v1/system/health > /dev/null; then
              echo "==> [SUCCESS] App is healthy and responding at http://127.0.0.1:8080"
            else
              echo "==> [NOTICE] Containers launched. Checking docker status:"
              $DOCKER -f docker-compose.prod.yml ps
            fi

            echo "================================================================"
            echo "==> DEPLOYMENT COMPLETE: https://portal.t4f-global.org"
            echo "================================================================"
