{% load i18n static admin_urls %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title }} | Tech4Future-Global Administration{% endblock %}</title>
    
    <link rel="shortcut icon" href="{% static 'img/t4f-global-logo.jpg' %}" type="image/jpeg">
    <link rel="icon" href="{% static 'img/t4f-global-logo.jpg' %}" type="image/jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome-free/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/adminlte/css/adminlte.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin_custom.css' %}">

    <style>
        body.login-page {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            background: radial-gradient(circle at 10% 15%, #183b6b 0%, #0c1f3a 50%, #061120 100%) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #ffffff;
        }

        .login-box {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-logo img {
            max-width: 88px !important;
            max-height: 88px !important;
            width: 88px !important;
            height: 88px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            margin: 0 auto 1rem auto !important;
            display: block !important;
            border: 3px solid rgba(255, 255, 255, 0.85) !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4) !important;
        }

        .login-box .card {
            background: #ffffff !important;
            border-radius: 18px !important;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            overflow: hidden;
        }

        .login-card-body {
            padding: 2.25rem 2rem !important;
            color: #0f172a !important;
        }
    </style>
</head>
<body class="login-page">

<div class="login-box">
    <div class="login-logo">
        <img src="{% static 'img/t4f-global-logo.jpg' %}" alt="Tech4Future-Global Crest">
        <h2 style="font-size: 1.45rem; font-weight: 800; color: #ffffff; margin-bottom: 0.25rem;">Tech4Future-Global</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin: 0;">Administration & Governance Portal</p>
    </div>

    <div class="card">
        <div class="card-body login-card-body">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="{% static 'admin/js/vendor/jquery/jquery.js' %}"></script>
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
