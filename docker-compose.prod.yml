services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: t4f-postgres:17-prod
    container_name: t4f-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-t4f_global}
      POSTGRES_USER: ${POSTGRES_USER:-t4f_app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-replace-this-production-password}"
    volumes:
      - t4f_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-t4f_app} -d ${POSTGRES_DB:-t4f_global}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: t4f-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - t4f_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: t4f-platform:v13-prod
    container_name: t4f-prod-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-replace-with-a-long-random-secret-for-production}"
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-portal.t4f-global.org,localhost,127.0.0.1,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://portal.t4f-global.org,http://portal.t4f-global.org}
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-t4f_global}
      POSTGRES_USER: ${POSTGRES_USER:-t4f_app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-replace-this-production-password}"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@t4f-global.org}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-T4f#2027}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Tech4Future-Global Super Administrator}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      WEB_WORKERS: ${WEB_WORKERS:-4}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Tech4Future-Global <no-reply@t4f-global.org>}
    volumes:
      - t4f_media_data:/app/backend/media
    expose:
      - "8000"
    ports:
      # Publishes to host port 8080 (NOT 8000) so host Nginx can proxy to it without port collisions
      - "${WEB_PORT:-8080}:8000"

  nginx:
    image: nginx:alpine
    container_name: t4f-prod-nginx
    restart: always
    profiles: ["docker-nginx"]
    depends_on:
      - web
    ports:
      # Docker Nginx ports (can be disabled or remapped if host Nginx is already bound to 80/443)
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/v1/system/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  t4f_postgres_data:
  t4f_redis_data:
  t4f_media_data:
