services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: t4f-postgres:17-prod
    container_name: t4f-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-t4f_global}
      POSTGRES_USER: ${POSTGRES_USER:-t4f_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in production}
    volumes:
      - t4f_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-t4f_app} -d ${POSTGRES_DB:-t4f_global}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: t4f-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - t4f_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: t4f-platform:v13-prod
    container_name: t4f-prod-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Error: DJANGO_SECRET_KEY must be set in production}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Error: DJANGO_ALLOWED_HOSTS must be set in production}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-t4f_global}
      POSTGRES_USER: ${POSTGRES_USER:-t4f_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in production}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@t4f-global.org}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-T4FGlobal@2026!}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Tech4Future-Global Super Administrator}
      COOKIE_SECURE: "true"
      WEB_WORKERS: ${WEB_WORKERS:-4}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Tech4Future-Global <no-reply@t4f-global.org>}
    volumes:
      - t4f_media_data:/app/backend/media
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: t4f-prod-nginx
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/v1/system/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  t4f_postgres_data:
  t4f_redis_data:
  t4f_media_data:
