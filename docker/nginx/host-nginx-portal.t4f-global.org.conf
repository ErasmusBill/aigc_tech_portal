# ==============================================================================
# Host Nginx Configuration for portal.t4f-global.org
# ==============================================================================
# Use this configuration if your VPS already runs Nginx directly on the host
# (sharing ports 80/443 with other domains like jobportal.sbpafrica.group).
#
# Installation on Ubuntu/Debian VPS:
#   1. Copy this file to: /etc/nginx/sites-available/portal.t4f-global.org
#   2. Symlink: sudo ln -s /etc/nginx/sites-available/portal.t4f-global.org /etc/nginx/sites-enabled/
#   3. Test config: sudo nginx -t
#   4. Reload Nginx: sudo systemctl reload nginx
#   5. Provision SSL (Certbot):
#      sudo certbot --nginx -d portal.t4f-global.org
# ==============================================================================

server {
    listen 80;
    server_name portal.t4f-global.org;

    client_max_body_size 100M;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Proxies to the Docker Web container port (default 8080, NOT 8000)
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket / Keep-Alive headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 90;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }
}

