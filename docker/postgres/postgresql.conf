# Production PostgreSQL 17 Configuration for Tech4Future-Global Management System

# Connectivity
listen_addresses = '*'
max_connections = 150

# Memory Configuration (Tuned for reliable medium workload)
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 4MB

# Checkpoints and WAL
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging & Monitoring
logging_collector = on
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# Locale & Character Set
timezone = 'UTC'
client_encoding = 'UTF8'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
